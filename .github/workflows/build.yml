name: build

on:
  workflow_run:
    workflows:
      - "unit tests"
    branches:
      - main
    types:
      - completed

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    uses: pysmo/.github/.github/workflows/build.yml@main

  check-wheel-packaging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: verify Alembic migration scripts are packaged in the wheel
        run: make check-wheel
