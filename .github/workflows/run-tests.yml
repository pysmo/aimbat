name: unit tests

on: [push, pull_request]

permissions:
  contents: read

env:
  # Use uv-managed CPython, not the runner's system Python: several aimbat
  # modules import tkinter at load time, which the standalone builds bundle
  # but the runner's system Python does not.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --locked --extra dev
      - name: Lint
        run: make lint
      - name: Test with pytest
        run: uv run pytest
